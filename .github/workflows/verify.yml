name: Verify pipeline

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U taxi -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=postgres user=taxi password=local-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt 'pytest>=7.4,<9'
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: local-test-password
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile '*' config --quiet
      - run: docker compose --profile '*' build
      - run: docker compose run --rm airflow db migrate
      - run: |
          set -o pipefail
          docker compose run --rm airflow dags list --local --columns dag_id --output plain |
            grep -E '^[[:space:]]*nyc_taxi_monthly[[:space:]]*$'
