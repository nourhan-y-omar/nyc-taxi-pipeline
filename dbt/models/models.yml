version: 2
models:
  - name: dim_zones
    description: One row per TLC zone ID, including 264 (Unknown) and 265 (Outside of NYC).
    columns:
      - name: location_id
        data_tests: [unique, not_null]
      - name: borough
        data_tests: [not_null]
      - name: zone
        data_tests: [not_null]
  - name: stg_trips
    description: One row per loaded source record, with mapped zone IDs, local pickup calendar fields and rule flags.
  - name: fct_trips
    description: One row per loaded source record, including flagged rows and source lineage.
    columns:
      - name: trip_id
        description: Source month and one-based row ordinal. Stable for a byte-identical input.
        data_tests: [unique, not_null]
      - name: source_month
        description: Month encoded in the source filename, independent of pickup time.
        data_tests: [not_null]
      - name: pickup_zone_id
        description: Mapped pickup zone, null for missing or unrecognized source IDs.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: dropoff_zone_id
        description: Mapped drop-off zone, null for missing or unrecognized source IDs.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: has_quality_issue
        description: True when one or more of the quality rules fail.
        data_tests: [not_null]
      - name: is_reportable_trip
        description: True for a pickup within its source month and a recognized pickup zone other than 264.
        data_tests: [not_null]
  - name: daily_zone_metrics
    description: One row per NYC-local pickup date and pickup zone with eligible pickups.
    columns:
      - name: pickup_date
        data_tests: [not_null]
      - name: pickup_zone_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: location_id
      - name: average_fare_amount
        description: Mean eligible metered fare in USD, rounded to cents. Uses fare_trip_count as denominator.
      - name: average_trip_distance
        description: Mean eligible trip distance in miles, rounded to two decimal places. Uses distance_trip_count as denominator.
  - name: hourly_demand
    description: One row per NYC-local pickup date and hour with eligible pickups. Repeated fall-back hours share a local bucket.
    columns:
      - name: pickup_date
        data_tests: [not_null]
      - name: pickup_hour
        data_tests: [not_null]
  - name: monthly_quality_metrics
    description: One row per source file month. Quality flag counts overlap and flagged_record_count counts each row once.
    columns:
      - name: source_month
        data_tests: [unique, not_null]
